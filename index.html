<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EARNKP | Secure Login</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000;
            background-image: radial-gradient(circle at 50% 0%, #1a3622 0%, #000000 60%);
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .auth-card { 
            background: #0f0f0f; 
            border: 1px solid #222; 
            border-radius: 28px; 
            width: 100%; 
            max-width: 400px; 
            padding: 40px 32px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); 
            box-sizing: border-box;
        }

        /* Pure CSS Layout Utilities */
        .text-center { text-align: center; }
        .mb-2 { margin-bottom: 8px; }
        .mb-6 { margin-bottom: 24px; }
        .mb-8 { margin-bottom: 32px; }
        
        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .brand-icon {
            width: 40px;
            height: 40px;
            background: #22c55e;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: 900;
            font-size: 20px;
        }
        
        .brand-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            margin: 0;
        }

        .heading { font-size: 20px; font-weight: 700; margin: 0 0 4px 0; color: #fff; }
        .subheading { font-size: 11px; font-weight: 600; color: #777; text-transform: uppercase; letter-spacing: 1.5px; margin: 0; }

        /* Input & Icon Styling */
        .input-group { 
            position: relative; 
            margin-bottom: 16px; 
            width: 100%;
        }
        
        /* Targets the Lucide SVG icon */
        .input-group svg { 
            position: absolute; 
            left: 16px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #555; 
            width: 20px;
            height: 20px;
            pointer-events: none;
            transition: 0.3s;
        }
        
        .input-group input { 
            background: #111; 
            border: 1px solid #222; 
            color: #fff; 
            border-radius: 16px; 
            padding: 16px 16px 16px 48px; /* Room for icon */
            width: 100%; 
            outline: none; 
            transition: 0.3s; 
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            box-sizing: border-box;
        }
        
        .input-group input::placeholder { color: #555; }
        .input-group input:focus { border-color: #22c55e; background: #151515; }
        .input-group:focus-within svg { color: #22c55e; }

        /* Button Styling */
        .btn-main { 
            background: #249643; 
            color: white; 
            font-weight: 800; 
            border-radius: 16px; 
            padding: 16px; 
            width: 100%; 
            border: none; 
            font-size: 15px; 
            cursor: pointer; 
            transition: 0.2s; 
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: inherit;
        }
        .btn-main:active { transform: scale(0.97); }
        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Text Buttons (Links) */
        .btn-text {
            background: transparent;
            border: none;
            color: #22c55e;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
        }
        .btn-text.gray { color: #777; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 24px; }
        .btn-text.gray svg { width: 16px; height: 16px; }

        /* Page switching logic */
        .page { display: none; width: 100%; flex-direction: column; }
        .page.active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .footer-area { margin-top: 32px; padding-top: 24px; border-top: 1px solid #1a1a1a; text-align: center; font-size: 13px; color: #777; }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- LOGIN SECTION -->
        <div id="login-page" class="page active">
            
            <div class="brand-logo">
                <div class="brand-icon">k</div>
                <h1 class="brand-text">EARNKP</h1>
            </div>

            <div class="text-center mb-8">
                <h2 class="heading">Welcome Back</h2>
                <p class="subheading">Sign in to your dashboard</p>
            </div>

            <div class="input-group">
                <i data-lucide="user"></i>
                <input type="text" id="login-uid" placeholder="User ID (e.g., KP00001)">
            </div>
            
            <div class="input-group">
                <i data-lucide="lock"></i>
                <input type="password" id="login-pass" placeholder="Password">
            </div>

            <button onclick="handleLogin()" id="login-btn" class="btn-main">Secure Login</button>
            
            <div class="footer-area">
                New Partner? <button onclick="toggleAuth('reg')" class="btn-text">Create Account</button>
            </div>
        </div>

        <!-- REGISTER SECTION -->
        <div id="reg-page" class="page">
            
            <div class="brand-logo mb-6">
                <h1 class="brand-text">Join <span style="color:#22c55e">EARNKP</span></h1>
            </div>

            <div class="text-center mb-6">
                <p class="subheading">Register a new account</p>
            </div>

            <div class="input-group">
                <i data-lucide="user-plus"></i>
                <input type="text" id="reg-name" placeholder="Full Name">
            </div>

            <div class="input-group">
                <i data-lucide="mail"></i>
                <input type="email" id="reg-email" placeholder="Email Address">
            </div>

            <div class="input-group">
                <i data-lucide="phone"></i>
                <input type="tel" id="reg-phone" placeholder="Phone Number">
            </div>

            <div class="input-group">
                <i data-lucide="key-round"></i>
                <input type="password" id="reg-pass" placeholder="Create Password">
            </div>

            <div class="input-group">
                <i data-lucide="users"></i>
                <input type="text" id="reg-ref" placeholder="Referral ID (Optional)">
            </div>

            <button onclick="handleRegister()" id="reg-btn" class="btn-main">Join Network</button>
            
            <button onclick="toggleAuth('login')" class="btn-text gray">
                <i data-lucide="arrow-left"></i> Back to Login
            </button>
        </div>
    </div>

    <!-- INITIALIZE ICONS -->
    <script>
        lucide.createIcons();
    </script>

    <!-- FIREBASE LOGIC (UNTOUCHED) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLMR-GDPWtcwn9Hn6eItlC2Qug-yhWZWY",
            authDomain: "earnkp-fed45.firebaseapp.com",
            projectId: "earnkp-fed45",
            storageBucket: "earnkp-fed45.firebasestorage.app",
            messagingSenderId: "519353079447",
            appId: "1:519353079447:web:d82b8cc4a8d741b43f3bd2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.toggleAuth = (p) => {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById(p + '-page').classList.add('active');
            // Re-render icons on page switch just in case
            setTimeout(() => lucide.createIcons(), 50);
        };

        window.handleRegister = async () => {
            const btn = document.getElementById('reg-btn');
            const data = {
                name: document.getElementById('reg-name').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                phone: document.getElementById('reg-phone').value.trim(),
                pass: document.getElementById('reg-pass').value,
                ref: document.getElementById('reg-ref').value.toUpperCase().trim() || "None"
            };

            if(!data.name || !data.email || !data.pass || !data.phone) return alert("All fields are mandatory!");
            btn.disabled = true; btn.innerText = "Generating KP-ID...";

            try {
                // Sequential ID Generation logic
                const kpId = await runTransaction(db, async (t) => {
                    const counterDoc = await t.get(doc(db, "settings", "counters"));
                    const count = counterDoc.exists() ? counterDoc.data().userCount + 1 : 1;
                    t.set(doc(db, "settings", "counters"), { userCount: count }, { merge: true });
                    return `KP${String(count).padStart(5, '0')}`;
                });

                const res = await createUserWithEmailAndPassword(auth, data.email, data.pass);
                
                await setDoc(doc(db, "users", res.user.uid), {
                    uid: res.user.uid, name: data.name, email: data.email, phone: data.phone,
                    userId: kpId, referralId: data.ref, topupBalance: 0, incomeBalance: 0,
                    package: 0, l1Inc: 0, l2Inc: 0, l3Inc: 0, pkgInc: 0,
                    bankLocked: false, role: 'user', date: new Date()
                });

                await setDoc(doc(db, "idMapping", kpId), { email: data.email });

                alert("Account Created! Your ID is: " + kpId);
                location.href = "app.html";
            } catch (e) { alert(e.message); btn.disabled = false; btn.innerText = "JOIN NETWORK"; }
        };

        window.handleLogin = async () => {
            const btn = document.getElementById('login-btn');
            const id = document.getElementById('login-uid').value.toUpperCase().trim();
            const pass = document.getElementById('login-pass').value;

            if(!id || !pass) return alert("Fill ID & Password!");
            btn.disabled = true;
            btn.innerText = "Authenticating...";

            try {
                const map = await getDoc(doc(db, "idMapping", id));
                if(!map.exists()) throw new Error("KP ID not found!");
                await signInWithEmailAndPassword(auth, map.data().email, pass);
                location.href = "app.html";
            } catch (e) { 
                alert(e.message); 
                btn.disabled = false; 
                btn.innerText = "SECURE LOGIN";
            }
        };
    </script>
</body>
</html>
